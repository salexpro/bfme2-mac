; Settings for the letterbox d3d9.dll (see letterbox.c)
[letterbox]
; vsync: -1 = leave the game's choice, 0 = off, 1 = on
vsync=-1
; fastfilter: 1 = build terrain mip-maps with the fast built-in filter instead of D3DX (removes the scroll stutter)
fastfilter=1
; jumpbudget: terrain tiles baked in the single frame of a camera jump (minimap click). 0 = game default (all at once,
; a ~0.1 s hitch); 6 = short hitch, the ground sharpens over the next few frames instead
jumpbudget=6
; syncpresent: even frame pacing. -1 = automatic: while the Mac holds the display's refresh rate, each frame waits for
; the real buffer swap and the game gets a clock that advances exactly one refresh per frame (smooth birds/animals);
; switches itself off when the Mac cannot hold the rate. 0 = off, 1 = always
syncpresent=-1
; frameclock: 1 = the regular per-frame clock while the pacing is locked, 0 = real clock only
frameclock=1
; topinset, refresh, valign, gamew and gameh are written by bfme2-fex.sh at every start (notch height, display refresh
; rate, picture position: pin VALIGN=top in display-override.conf to put the picture right under the notch; the game
; resolution it picked, which the proxy adds to the game's list of display modes)
; roundbuttons: 1 = draw the round command buttons over a selected building round on a widescreen picture (the game
; stretches them from 4:3), 0 = leave them stretched
roundbuttons=1
; gamefps (written by bfme2-fex.sh): the frame rate SAGE Unlocked runs at; flash/tint effects that the game times in
; drawn frames are lengthened by gamefps/30 so they last as long as at the original 30 fps
; Corrections for running above 30 fps with SAGE Unlocked (all default 1, only active when gamefps > 30):
; firstphase   = the game's "new logic tick" latch fires once per tick instead of on every frame of phase 1 (without it
;                fades, model animation and other interpolated things move in 5-per-second steps)
; realframelen = the animation clock (scripted cameras, model animation, water) advances by the real frame time
;                instead of a fixed 1000/fps ms, so nothing runs in slow motion when the frame rate is below the cap
; logicinterp  = the logic-side interpolation fraction is phase/6 as at 30 fps
; ringtiming   = the selection ring on the ground (units and buildings) pulses, turns and closes at the 30 fps pace
; netfps       = in network games the game lowers its frame rate to about 70 % of the cap while it waits for the other
;                player's data; with the unlock that only costs frames (the logic waits by itself). 1 = keep the cap
firstphase=1
ringtiming=1
realframelen=1
logicinterp=1
netfps=1
; showfps: 1 = show the frame rate in the top-left corner from the start. Ctrl+Shift+F switches it on and off in the game.
showfps=0
; horplus: 1 = on a wide picture show the full height the game was designed for at 4:3 and add the extra width at
; the sides (nothing is trimmed top and bottom; everything is a little smaller), 0 = the game's own behaviour
horplus=1
; ringround: 1 = the spinning ring of the title screen (a small video the game stretches with its 4:3 layout) is
;   drawn narrower so that it is round on a wide picture; 0 = as the game draws it
ringround=1
; heapkeep: 1 = the game's reserved heap ranges stay accessible. A write of the game into a part of its heap that is
;   not committed (any more) is a plain crash on Windows; under the FEX emulator it becomes an endless fault loop:
;   the game freezes for good. With 1 such a write lands in unused memory instead.
heapkeep=1
; farguard: 1 = a unit that ends up absurdly far outside the map (it happens in big matches; the game then crashes
;   in its collision code) is taken out of the collision bookkeeping before that, and the log names it; 0 = off
farguard=1
; noglcheck: 1 = Wine's Direct3D stops asking OpenGL for an error code after every single call (it only ever printed
;   a message). Under the emulator every such call is expensive: about +12 % frame rate in a battle.
noglcheck=1
; spinwait: microseconds for which the Direct3D helper thread keeps polling for work before it goes to sleep, 0 = off.
;   The game hands every vertex-buffer write to that thread and waits for it, several hundred times a frame in a
;   battle; waking a sleeping thread each time cost about a third of the frame. About +12 % in a battle.
spinwait=0
; watch: 1 = a watchdog writes to the log where the game's thread is when no frame was finished for 4 s, and a crash of
;   the game itself (access violation inside game.dat) is noted with registers, stack and return addresses; 2 = it also
;   samples frames that take longer than 60 ms; 0 = off
watch=1
; diagnostics, all 0 unless something is being measured (see letterbox.c): profile=1 time per Direct3D method,
;   sample=1 sampling profiler (better: the test command "sample 1" after a map has loaded), cswait=1 how the
;   Direct3D layer's threads wait
