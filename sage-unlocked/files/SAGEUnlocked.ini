; SAGE Unlocked settings
fps=120
; skip = parts of the unlock that are left out (comma separated).
;   eveninterp: the drawn interpolation that runs evenly over a logic tick. Smoother for steady movers (birds no
;   longer hitch five times a second), but with it big matches crashed or froze after 6-18 minutes in every test
;   (the game's collision bookkeeping gets damaged). Left out until the cause is found; remove it from the list
;   to have the even interpolation back.
;   netrestart: the timetable restart after a tick the network held back (LAN smoothing).  multiphase: several
;   logic phases in one frame when the frame rate is below the logic rate.
skip=eveninterp
